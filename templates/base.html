{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock title %} | StellerCart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  {% block css %}{% endblock css %}
  <link rel="stylesheet" href="{% static 'styles/shared/general.css' %}">
  <link rel="stylesheet" href="{% static 'styles/shared/amazon-header.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* ── Rocket Loader Overlay ── */
    #loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(ellipse at center, #0b0a1a, #05040e);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #loader-overlay.active {
      display: flex;
      opacity: 1;
    }
    
    .rocket {
      position: relative;
      width: 60px;
      height: 80px;
      animation: launch 1.2s ease-in-out infinite alternate;
    }
    .rocket-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 60px;
      background: linear-gradient(135deg, #a78bfa, #6d28d9);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 30px rgba(109, 40, 217, 0.5);
    }
    .rocket-window {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #c4b5fd;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.6);
    }
    .rocket-fin {
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 20px;
      background: #4f46e5;
      border-radius: 0 0 4px 4px;
    }
    .rocket-fin-left { left: -4px; transform: skewX(-15deg); }
    .rocket-fin-right { right: -4px; transform: skewX(15deg); }
    
    .rocket-flame {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 30px;
      background: linear-gradient(to top, #f59e0b, #ef4444, transparent);
      border-radius: 0 0 50% 50%;
      filter: blur(2px);
      animation: flame 0.3s infinite alternate;
    }
    
    @keyframes launch {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes flame {
      0% { height: 25px; opacity: 0.8; }
      100% { height: 35px; opacity: 1; }
    }
    
    .loader-text {
      margin-top: 40px;
      color: #c4b5fd;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 2px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Rocket Loader Overlay -->
  <div id="loader-overlay">
    <div class="rocket">
      <div class="rocket-body">
        <div class="rocket-window"></div>
        <div class="rocket-fin rocket-fin-left"></div>
        <div class="rocket-fin rocket-fin-right"></div>
        <div class="rocket-flame"></div>
      </div>
    </div>
    <p class="loader-text">Launching StellerCart…</p>
  </div>

  {% block header %}{% endblock header %}
  {% block body %}{% endblock body %}
  {% block footer %}{% endblock footer %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block script %}{% endblock script %}

  <script>
    // Loader helpers
    function showLoader() {
      const overlay = document.getElementById('loader-overlay');
      overlay.classList.add('active');
    }
    function hideLoader() {
      const overlay = document.getElementById('loader-overlay');
      overlay.classList.remove('active');
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
    }

    // Show loader if just_logged_in flag is set (from server)
    {% if just_logged_in %}
      document.addEventListener('DOMContentLoaded', function() {
        showLoader();
        setTimeout(hideLoader, 2000);
      });
    {% endif %}
  </script>
  
</body>
</html>
